<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --accent-red: #ff4444;
            --accent-green: #00ff88;
            --border: #2a2a2a;
            --glow: rgba(0, 255, 136, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 68, 68, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.4;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 60px 50px;
            max-width: 580px;
            width: 100%;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.02),
                0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--accent-red);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .message {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .message strong {
            color: var(--accent-green);
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 32px 0;
        }

        .contact-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .contact-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .contact-btn:hover::before {
            transform: translateX(100%);
        }

        .contact-btn:hover {
            transform: translateX(4px);
            border-color: var(--accent-green);
            box-shadow: 0 0 24px var(--glow);
        }

        .contact-btn:active {
            transform: translateX(2px);
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--bg-primary);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .icon-svg {
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }

        .telegram .icon-wrapper {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
        }

        .snapchat-icon {
            background: transparent !important;
        }

        .btn-label {
            flex: 1;
            text-align: left;
        }

        .btn-arrow {
            color: var(--text-secondary);
            font-size: 18px;
            transition: transform 0.3s;
        }

        .contact-btn:hover .btn-arrow {
            transform: translateX(4px);
            color: var(--accent-green);
        }

        .footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 15px;
            }

            .contact-btn {
                padding: 16px 20px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 22px;
            }

            .btn-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    
    <div class="container">
        <div class="status-bar">
            <div class="status-dot"></div>
            <div class="status-text">False Ban — Appeal Pending</div>
        </div>

        <h1>Discord Suspended</h1>
        
        <p class="message">
            My Discord got falsely banned and I've submitted an appeal. While I wait for a response, you can reach me on these platforms instead.
        </p>

        <div class="divider"></div>

        <div class="contact-header">→ Reach me here</div>

        <div class="contact-links">
            <a href="https://t.me/isadamii" class="contact-btn telegram" target="_blank" rel="noopener noreferrer">
                <div class="icon-wrapper">
                    <svg class="icon-svg" fill="white" viewBox="0 0 24 24">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
                    </svg>
                </div>
                <div class="btn-label">Telegram</div>
                <div class="btn-arrow">→</div>
            </a>

            <a href="https://www.snapchat.com/add/the_isadami" class="contact-btn snapchat" target="_blank" rel="noopener noreferrer">
                <div class="icon-wrapper snapchat-icon">
                    <img src="https://cdn.freebiesupply.com/logos/large/2x/snapchat-logo-png-transparent.png" alt="Snapchat" style="width: 28px; height: 28px;">
                </div>
                <div class="btn-label">Snapchat</div>
                <div class="btn-arrow">→</div>
            </a>
        </div>

        <div class="footer">
            // Thanks for understanding
        </div>
    </div>
</body>
</html>
